
{% extends "base.html" %}

{% block title %}
Add Skill
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card border-0 shadow-lg"
                 style="border-radius: 25px; overflow: hidden;">

                <div class="p-4 text-white text-center"
                     style="background: linear-gradient(135deg, #2d3436, #636e72);">

                    <h2 class="fw-bold mb-2">
                        Add a Skill
                    </h2>

                    <p class="mb-0">
                        Choose a skill you can teach or want to learn.
                    </p>

                </div>

                <div class="card-body p-5">

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Select Skill -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Select Skill
                            </label>

                            <select name="skill"
                                    class="form-select"
                                    required>

                                <option value="">
                                    -- Select a Skill --
                                </option>

                                {% for skill in all_skills %}

                                <option value="{{ skill.id }}">
                                    {{ skill.name }} - {{ skill.category }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Skill Type -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Skill Type
                            </label>

                            <div class="mt-3">

                                <div class="form-check mb-3">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="skill_type"
                                           value="teach"
                                           id="teach"
                                           required>

                                    <label class="form-check-label"
                                           for="teach">

                                        📚 I Can Teach This

                                    </label>

                                </div>


                                <div class="form-check">

                                    <input class="form-check-input"
                                           type="radio"
                                           name="skill_type"
                                           value="learn"
                                           id="learn">

                                    <label class="form-check-label"
                                           for="learn">

                                        🎯 I Want to Learn This

                                    </label>

                                </div>

                            </div>

                        </div>


                        <!-- Buttons -->

                        <div class="d-flex justify-content-center gap-3 mt-5">

                            <a href="{% url 'skills' %}"
                               class="btn btn-secondary px-4 py-2"
                               style="border-radius: 50px;">

                                Cancel

                            </a>

                            <button type="submit"
                                    class="btn px-5 py-2"
                                    style="background: linear-gradient(135deg, #2d3436, #636e72);
                                           color: white;
                                           border: none;
                                           border-radius: 50px;
                                           font-weight: 600;">

                                Save Skill

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
