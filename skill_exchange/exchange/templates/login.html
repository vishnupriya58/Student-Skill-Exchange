{% extends "base.html" %}

{% block title %}
Login - Student Skill Exchange
{% endblock %}

{% block content %}

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

    /* ============ PAGE WRAPPER ============ */
    .login-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: 'Poppins', sans-serif;
        margin: -1rem -0.75rem;
        position: relative;
        overflow: hidden;
        background: #06021a;
    }

    /* Deep animated aurora background */
    .login-page::before {
        content: "";
        position: absolute;
        inset: -25%;
        background:
            radial-gradient(circle at 20% 25%, rgba(139, 92, 246, 0.55), transparent 38%),
            radial-gradient(circle at 80% 15%, rgba(236, 72, 153, 0.45), transparent 40%),
            radial-gradient(circle at 80% 85%, rgba(6, 182, 212, 0.40), transparent 40%),
            radial-gradient(circle at 20% 85%, rgba(124, 58, 237, 0.50), transparent 40%);
        animation: auroraMove 24s ease-in-out infinite;
        z-index: 0;
    }
    .login-page::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(145deg, #06021a 0%, #14082e 45%, #06021a 100%);
        opacity: 0.75;
        z-index: 0;
    }

    @keyframes auroraMove {
        0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
        33%      { transform: translate(30px, -20px) scale(1.1) rotate(60deg); }
        66%      { transform: translate(-25px, 25px) scale(1.05) rotate(-40deg); }
    }

    /* Grid pattern overlay */
    .grid-overlay {
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: 55px 55px;
        z-index: 1;
        pointer-events: none;
        mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
        -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
    }

    /* Particles */
    .particle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.7);
        box-shadow: 0 0 14px rgba(167, 139, 250, 0.9);
        pointer-events: none;
        animation: floatUp linear infinite;
        z-index: 1;
    }
    @keyframes floatUp {
        0%   { transform: translateY(0) scale(0.5); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateY(-110vh) scale(1.15); opacity: 0; }
    }

    /* ============ MAIN CONTENT ============ */
    .login-main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.25rem;
        position: relative;
        z-index: 2;
    }

    /* ============ GLASS CARD ============ */
    .glass-login {
        position: relative;
        width: 100%;
        max-width: 460px;
        border-radius: 32px;
        padding: 3rem 2.4rem;
        background: rgba(18, 12, 42, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(26px) saturate(150%);
        -webkit-backdrop-filter: blur(26px) saturate(150%);
        box-shadow:
            0 30px 100px rgba(0, 0, 0, 0.7),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        animation: cardIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes cardIn {
        from { opacity: 0; transform: translateY(50px) scale(0.94); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============ NEON ANIMATED BORDER (FIXED) ============ */
    .glass-login::before {
        content: "";
        position: absolute;
        inset: -1.5px;
        border-radius: 32px;
        padding: 1.5px;
        background: conic-gradient(
            from 0deg,
            #a78bfa, #ec4899, #06b6d4, #10b981, #a78bfa
        );
        -webkit-mask:
            linear-gradient(#000 0 0) content-box,
            linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
            linear-gradient(#000 0 0) content-box,
            linear-gradient(#000 0 0);
        mask-composite: exclude;
        opacity: 0.55;
        pointer-events: none;
        animation: spinBorder 6s linear infinite;
    }

    @keyframes spinBorder {
        to { filter: hue-rotate(360deg); }
    }

    /* Brand icon */
    .brand-badge {
        width: 92px;
        height: 92px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 28px;
        background: linear-gradient(135deg, #7c3aed, #ec4899);
        color: #fff;
        font-size: 2.6rem;
        box-shadow:
            0 20px 45px rgba(124, 58, 237, 0.6),
            0 0 60px rgba(236, 72, 153, 0.35);
        animation: badgeFloat 4s ease-in-out infinite;
    }
    @keyframes badgeFloat {
        0%, 100% { transform: translateY(0) rotate(-6deg); }
        50%      { transform: translateY(-12px) rotate(6deg); }
    }

    .login-title {
        color: #fff;
        font-weight: 800;
        letter-spacing: -0.6px;
        margin-top: 1.3rem;
        font-size: 2rem;
    }
    .login-title .grad {
        background: linear-gradient(135deg, #a78bfa, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .login-sub {
        color: #c4b5fd;
        font-size: 0.95rem;
        margin-top: 0.4rem;
        margin-bottom: 2rem;
        opacity: 0.85;
    }

    /* Labels */
    .login-label {
        color: #ddd6fe;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        margin-left: 6px;
        margin-bottom: 8px;
        display: block;
    }
    .login-label i { color: #a78bfa; }

    /* Inputs */
    .login-input .input-group-text {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-right: none;
        color: #a78bfa;
        padding: 0 18px;
        border-radius: 50px 0 0 50px;
        font-size: 1rem;
    }
    .login-input .form-control {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-left: none;
        border-radius: 0 50px 50px 0;
        color: #fff;
        padding: 14px 20px;
        font-size: 0.95rem;
        transition: all 0.25s ease;
    }
    .login-input .form-control::placeholder {
        color: rgba(255, 255, 255, 0.35);
    }
    .login-input .form-control:focus {
        background: rgba(255, 255, 255, 0.09);
        color: #fff;
        border-color: #a78bfa;
        box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.22);
        outline: none;
    }

    /* Login button */
    .btn-neon {
        position: relative;
        width: 100%;
        border: none;
        border-radius: 50px;
        padding: 15px;
        font-weight: 700;
        font-size: 1.02rem;
        letter-spacing: 0.6px;
        color: #fff;
        background: linear-gradient(135deg, #7c3aed, #8b5cf6 45%, #ec4899);
        background-size: 220% 220%;
        box-shadow: 0 15px 40px rgba(124, 58, 237, 0.5);
        transition: all 0.35s ease;
        overflow: hidden;
        animation: btnShift 6s ease infinite;
    }
    @keyframes btnShift {
        0%, 100% { background-position: 0% 50%; }
        50%      { background-position: 100% 50%; }
    }
    .btn-neon:hover {
        color: #fff;
        transform: translateY(-3px);
        box-shadow: 0 25px 55px rgba(124, 58, 237, 0.7);
    }
    .btn-neon:active { transform: translateY(0); }

    /* Links */
    .link-purple {
        color: #a78bfa;
        font-weight: 700;
        text-decoration: none;
        transition: 0.25s ease;
        border-bottom: 2px solid transparent;
        padding-bottom: 2px;
    }
    .link-purple:hover {
        color: #ddd6fe;
        border-bottom-color: #ddd6fe;
    }

    .login-foot { color: #c4b5fd; font-size: 0.95rem; }

    /* Checkbox */
    .glass-login .form-check-input {
        background-color: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.25);
        width: 1.1em;
        height: 1.1em;
        margin-top: 0.15em;
    }
    .glass-login .form-check-input:checked {
        background-color: #7c3aed;
        border-color: #7c3aed;
        box-shadow: 0 0 12px rgba(124, 58, 237, 0.7);
    }
    .glass-login .form-check-label {
        color: #c4b5fd;
        font-size: 0.9rem;
    }

    /* Divider */
    .login-divider {
        display: flex;
        align-items: center;
        margin: 1.5rem 0;
        color: rgba(255, 255, 255, 0.35);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 2px;
    }
    .login-divider::before,
    .login-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }
    .login-divider span { padding: 0 14px; }

    /* Social buttons */
    .social-row {
        display: flex;
        justify-content: center;
        gap: 12px;
    }
    .social-btn {
        width: 48px;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #e5e7eb;
        font-size: 1.15rem;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        text-decoration: none;
    }
    .social-btn:hover {
        transform: translateY(-5px) scale(1.08);
        color: #fff;
        border-color: rgba(167, 139, 250, 0.6);
        box-shadow: 0 15px 30px rgba(124, 58, 237, 0.45);
    }
    .social-btn.fb:hover  { background: linear-gradient(135deg, #1877f2, #0a5cd6); }
    .social-btn.tw:hover  { background: linear-gradient(135deg, #1da1f2, #0d8bd9); }
    .social-btn.gg:hover  { background: linear-gradient(135deg, #ea4335, #c5221f); }
    .social-btn.li:hover  { background: linear-gradient(135deg, #0a66c2, #064b8f); }

    @media (max-width: 576px) {
        .glass-login { padding: 2.2rem 1.5rem; border-radius: 26px; }
        .brand-badge { width: 74px; height: 74px; font-size: 2.1rem; }
        .login-title { font-size: 1.6rem; }
    }
</style>

<div class="login-page">

    <!-- Background decorations -->
    <div class="grid-overlay"></div>
    <div id="particles"></div>

    <!-- MAIN -->
    <div class="login-main">

        <div class="glass-login">

            <!-- HEADER -->
            <div class="text-center">
                <div class="brand-badge">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h2 class="login-title">
                    Welcome <span class="grad">Back</span>
                </h2>
                <p class="login-sub">Sign in to continue sharing skills</p>
            </div>

            <!-- FORM -->
            <form method="POST">
                {% csrf_token %}

                <!-- USERNAME -->
                <div class="mb-3">
                    <label for="username" class="login-label">
                        <i class="fas fa-user me-1"></i> Username
                    </label>
                    <div class="input-group login-input">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text"
                               name="username"
                               id="username"
                               class="form-control"
                               placeholder="Enter your username"
                               required
                               autofocus>
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="login-label mb-0">
                            <i class="fas fa-lock me-1"></i> Password
                        </label>
                        <a href="#" class="link-purple" style="font-size:0.78rem;">Forgot?</a>
                    </div>
                    <div class="input-group login-input mt-2">
                        <span class="input-group-text"><i class="fas fa-key"></i></span>
                        <input type="password"
                               name="password"
                               id="password"
                               class="form-control"
                               placeholder="Enter your password"
                               required>
                    </div>
                </div>

                <!-- REMEMBER -->
                <div class="mb-4 form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">
                        Keep me signed in
                    </label>
                </div>

                <!-- SUBMIT -->
                <button type="submit" class="btn-neon">
                    <i class="fas fa-sign-in-alt me-2"></i> Login
                </button>
            </form>

            <!-- REGISTER LINK -->
            <p class="text-center login-foot mt-4 mb-0">
                Don't have an account?
                <a href="{% url 'register' %}" class="link-purple ms-1">
                    Register <i class="fas fa-arrow-right ms-1"></i>
                </a>
            </p>

            <!-- DIVIDER -->
            <div class="login-divider">
                <span>OR CONTINUE WITH</span>
            </div>

            <!-- SOCIAL -->
            <div class="social-row">
                <a href="#" class="social-btn fb" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-btn tw" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" class="social-btn gg" aria-label="Google"><i class="fab fa-google"></i></a>
                <a href="#" class="social-btn li" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            </div>

        </div>
    </div>

</div>

<script>
    // Glowing floating particles
    (function () {
        const container = document.getElementById('particles');
        if (!container) return;
        for (let i = 0; i < 26; i++) {
            const p = document.createElement('span');
            p.className = 'particle';
            const size = Math.random() * 4 + 2;
            p.style.width  = size + 'px';
            p.style.height = size + 'px';
            p.style.left   = Math.random() * 100 + '%';
            p.style.top    = (100 + Math.random() * 20) + '%';
            p.style.animationDuration = (10 + Math.random() * 14) + 's';
            p.style.animationDelay    = (-Math.random() * 18) + 's';
            container.appendChild(p);
        }
    })();
</script>

{% endblock %}
